<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 배경 이미지 설정 (원하시는 이미지 주소로 변경 가능) */
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.65); /* 배경 이미지 위에 살짝 하얀 필터를 얹어 글씨를 잘 보이게 함 */
            backdrop-filter: blur(2px);
        }
        .dday-card {
            position: relative;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px 28px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            width: 240px;
        }
        .dday-title {
            font-size: 14px;
            color: #555555;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .dday-count {
            font-size: 32px;
            font-weight: 700;
            color: #1f2328;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="dday-card">
        <div class="dday-title" id="title">목표일</div>
        <div class="dday-count" id="counter">D-0</div>
    </div>

    <script>
        // URL 주소창에서 ?title=이름&date=YYYY-MM-DD 값을 읽어옵니다.
        const urlParams = new URLSearchParams(window.location.search);
        
        const titleParam = urlParams.get('title');
        const dateParam = urlParams.get('date');

        // 값이 있으면 그 값으로, 없으면 기본값으로 세팅
        const titleText = titleParam ? decodeURIComponent(titleParam) : "목표 달성";
        const targetDateStr = dateParam ? dateParam : "2026-12-31";

        document.getElementById('title').innerText = titleText;

        function calculateDday() {
            const today = new Date();
            const tParts = targetDateStr.split('-');
            const targetDate = new Date(tParts[0], tParts[1] - 1, tParts[2]);

            const tDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const cDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const diffTime = tDate - cDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const counterEl = document.getElementById('counter');
            if (diffDays > 0) {
                counterEl.innerText = `D-${diffDays}`;
            } else if (diffDays === 0) {
                counterEl.innerText = `D-Day`;
            } else {
                counterEl.innerText = `D+${Math.abs(diffDays)}`;
            }
        }

        calculateDday();
    </script>
</body>
</html>
