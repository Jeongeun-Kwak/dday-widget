<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 요청하신 핀터레스트 이미지 주소 적용 */
            background-image: url('https://i.pinimg.com/736x/65/e6/8d/65e68d06e2a77d86621e6d747d710605.jpg');
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 배경 이미지만 흐리게(Blur) 만드는 레이어 */
        .bg-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.pinimg.com/736x/65/e6/8d/65e68d06e2a77d86621e6d747d710605.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(6px); /* 흐림 정도 조절 (숫자가 클수록 흐려짐) */
            transform: scale(1.1); /* 블러 때문에 생기는 테두리 흰 여백 방지 */
            z-index: 1;
        }
        /* 글자 가독성을 위한 어두운/반투명 오버레이 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25); /* 살짝 어둡게 만들어 글자를 돋보이게 함 */
            z-index: 2;
        }
        /* 디데이 카드 디자인 */
        .dday-card {
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.85); /* 반투명 흰색 카드 */
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 24px 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 240px;
        }
        .dday-title {
            font-size: 14px;
            color: #444444;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .dday-count {
            font-size: 34px;
            font-weight: 700;
            color: #111111;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="overlay"></div>
    
    <div class="dday-card">
        <div class="dday-title" id="title">목표일</div>
        <div class="dday-count" id="counter">D-0</div>
    </div>

    <script>
        // URL 파라미터에서 제목과 날짜 읽어오기 (?title=제목&date=YYYY-MM-DD)
        const urlParams = new URLSearchParams(window.location.search);
        
        const titleParam = urlParams.get('title');
        const dateParam = urlParams.get('date');

        const titleText = titleParam ? decodeURIComponent(titleParam) : "디데이";
        const targetDateStr = dateParam ? dateParam : "2026-12-31";

        document.getElementById('title').innerText = titleText;

        function calculateDday() {
            const today = new Date();
            const tParts = targetDateStr.split('-');
            const targetDate = new Date(tParts[0], tParts[1] - 1, tParts[2]);

            const tDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const cDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const diffTime = tDate - cDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const counterEl = document.getElementById('counter');
            if (diffDays > 0) {
                counterEl.innerText = `D-${diffDays}`;
            } else if (diffDays === 0) {
                counterEl.innerText = `D-Day`;
            } else {
                counterEl.innerText = `D+${Math.abs(diffDays)}`;
            }
        }

        calculateDday();
    </script>
</body>
</html>
