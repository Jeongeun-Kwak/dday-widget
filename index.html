<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-size: cover;
            background-position: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .bg-blur {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(2px);
            transform: scale(1.05);
            z-index: 1;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }
        .dday-card {
            position: relative;
            z-index: 3;
            background: transparent;
            text-align: center;
            width: 240px;
            padding: 20px;
        }
        .dday-title {
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        .dday-count {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="bg-blur" id="bgBlur"></div>
    <div class="overlay"></div>
    
    <div class="dday-card">
        <div class="dday-title" id="title">디데이</div>
        <div class="dday-count" id="counter">D-0</div>
    </div>

    <script>
        // URL 파라미터 읽기 (?title=제목&date=날짜&bg=이미지주소)
        const urlParams = new URLSearchParams(window.location.search);
        
        const titleParam = urlParams.get('title');
        const dateParam = urlParams.get('date');
        const bgParam = urlParams.get('bg');

        // 기본값 설정 (이미지 주소가 없으면 기존 핀터레스트 이미지 사용)
        const defaultBg = 'https://i.pinimg.com/736x/65/e6/8d/65e68d06e2a77d86621e6d747d710605.jpg';
        const bgImage = bgParam ? decodeURIComponent(bgParam) : defaultBg;

        // 배경 이미지 적용
        document.body.style.backgroundImage = `url('${bgImage}')`;
        document.getElementById('bgBlur').style.backgroundImage = `url('${bgImage}')`;

        const titleText = titleParam ? decodeURIComponent(titleParam) : "디데이";
        const targetDateStr = dateParam ? dateParam : "2026-12-31";

        document.getElementById('title').innerText = titleText;

        function calculateDday() {
            const today = new Date();
            const tParts = targetDateStr.split('-');
            const targetDate = new Date(tParts[0], tParts[1] - 1, tParts[2]);
            const tDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const cDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const diffTime = tDate - cDate;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            const counterEl = document.getElementById('counter');
            if (diffDays > 0) {
                counterEl.innerText = `D-${diffDays}`;
            } else if (diffDays === 0) {
                counterEl.innerText = `D-Day`;
            } else {
                counterEl.innerText = `D+${Math.abs(diffDays)}`;
            }
        }
        calculateDday();
    </script>
</body>
</html>
